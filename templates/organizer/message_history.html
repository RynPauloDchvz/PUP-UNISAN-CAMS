{% extends 'organizer_base.html' %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static \'css/organizer/message_history.css\' %}">
{% endblock extra_head %}

{% block skeleton %}
<div class="w-full relative pb-16 bg-[#f4f4f4] dark:bg-[#0a0a0a] min-h-screen pt-8">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-8">
            <div class="w-32 h-4 rounded skeleton-shimmer"></div>
        </div>
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 mb-8 border-b border-gray-200 dark:border-gray-800 pb-6">
            <div class="w-64 h-10 rounded-lg skeleton-shimmer"></div>
            <div class="w-full sm:w-80 h-12 rounded-xl skeleton-shimmer"></div>
        </div>
        <div class="flex flex-col gap-4">
            <div v-for="i in 6" :key="i" class="h-32 bg-white dark:bg-[#151515] rounded-2xl border border-gray-100 dark:border-gray-800 p-5 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-start sm:items-center gap-4 flex-1 w-full">
                    <div class="w-12 h-12 rounded-full skeleton-shimmer shrink-0"></div>
                    <div class="space-y-2 flex-1">
                        <div class="w-48 h-5 rounded skeleton-shimmer"></div>
                        <div class="w-24 h-3 rounded skeleton-shimmer"></div>
                        <div class="w-full h-4 rounded skeleton-shimmer"></div>
                    </div>
                </div>
                <div class="w-20 h-4 rounded skeleton-shimmer shrink-0"></div>
            </div>
        </div>
    </div>
</div>
{% endblock skeleton %}

{% block content %}
<div v-pre>

<div class="w-full relative pb-16 bg-[#f4f4f4] dark:bg-[#0a0a0a] min-h-screen font-sans transition-colors duration-300 pt-8">
    
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 mb-8 border-b border-gray-200 dark:border-gray-800 pb-6">
            <h1 class="text-3xl sm:text-4xl font-black text-pup-maroon dark:text-pup-gold uppercase tracking-wide flex items-center gap-3">
                <i class="ph-fill ph-bell text-3xl"></i> Message History
            </h1>
            
            <div class="relative w-full sm:w-80 shrink-0">
                <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg"></i>
                <input type="text" id="searchInput" onkeyup="filterNotifications()" placeholder="Search title, sender, or content..." class="w-full border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#151515] rounded-xl pl-10 pr-4 py-3 text-sm font-medium outline-none focus:border-pup-maroon dark:focus:border-pup-gold text-gray-900 dark:text-white transition shadow-sm">
            </div>
        </div>

        <div class="flex flex-col gap-4" id="notificationsContainer">
            <!-- Notifications will be injected here -->
        </div>

    </div>

</div>
</div>
{% endblock content %}

{% block extra_js %}
<script id="django-notifs-data" type="application/json">
    {{ notifications_json|safe }}
</script>
<script src="{% static \'js/organizer/message_history.js\' %}"></script>
{% endblock extra_js %}
